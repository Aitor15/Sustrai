function confettiBurst(el){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,C=["#ff4d6d","#ffd166","#06d6a0","#4cc9f0","#b388ff","#ff9f1c"];
 const cv=document.createElement("canvas");cv.className="cfx";cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;document.body.appendChild(cv);const x=cv.getContext("2d");x.scale(devicePixelRatio,devicePixelRatio);
 const P=Array.from({length:140},()=>{const a=Math.random()*Math.PI*2,s=4+Math.random()*9;return{x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:5+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[Math.random()*6|0]}});let t=0;
 (function f(){x.clearRect(0,0,innerWidth,innerHeight);t++;P.forEach(p=>{p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-t/110);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));x.restore()});if(t<110)requestAnimationFrame(f);else cv.remove()})()}

/* ---------- kontsumo erreala (sarea + plakak − isuria) ---------- */
const EROL={sarea:"🔌 Saretik erosia (orokorra 1.18.0)",plakak:"☀️ Plaken ekoizpena (plaken kontagailua 1.28.0)",isuria:"↗ Sarera isuria (orokorra 1.28.0)",beste:"Beste bat"};
function mDaily(m){const D={};mIntervals(m).forEach(x=>{if(x.neg)return;let d=new Date(x.a+"T00:00");for(let k=0;k<x.days;k++){d.setDate(d.getDate()+1);const key=iso(d);D[key]=(D[key]||0)+x.pd}});return D}
function combFor(place){const M=meters.filter(m=>m.kind==="el"&&(m.place||"")===(place||"")&&m.erol&&m.erol!=="beste");
 const G=M.filter(m=>m.erol==="sarea"),P=M.filter(m=>m.erol==="plakak"),X=M.filter(m=>m.erol==="isuria");if(!G.length||!P.length)return null;
 const add=(L)=>{const o={};L.forEach(m=>Object.entries(mDaily(m)).forEach(([d,v])=>o[d]=(o[d]||0)+v));return o};
 const g=add(G),p=add(P),x=add(X);
 // egun komunak bakarrik (bi kontagailuen datuak dauden egunak)
 const days=Object.keys(g).filter(d=>d in p).sort();
 return{days,g,p,x,G,P,X}}
const wkStart=d=>{const t=new Date(d+"T00:00"),w=(t.getDay()+6)%7;t.setDate(t.getDate()-w);return iso(t)};
function combAgg(c,keyFn){const A={};c.days.forEach(d=>{const k=keyFn(d),o=A[k]=A[k]||{g:0,p:0,x:0,n:0};o.g+=c.g[d]||0;o.p+=c.p[d]||0;o.x+=c.x[d]||0;o.n++});
 return Object.entries(A).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,o])=>({k,...o,real:o.g+o.p-o.x,self:o.p-o.x}))}
function combChart(rows,lbl){if(!rows.length)return "";const mx=Math.max(1,...rows.map(r=>r.real)),W=330,H=120,n=rows.length,bw=W/n;
 let s=`<svg viewBox="0 0 ${W} ${H+22}" width="100%" role="img" aria-label="Kontsumo erreala">`;
 rows.forEach((r,i)=>{const x=i*bw,hg=r.g/mx*H*0.9,hs=Math.max(0,r.self)/mx*H*0.9;
  s+=`<rect x="${x+3}" y="${H-hg}" width="${bw-6}" height="${hg}" rx="2" fill="#ffb627"><title>Saretik: ${nf(r.g)} kWh</title></rect><rect x="${x+3}" y="${H-hg-hs}" width="${bw-6}" height="${hs}" rx="2" fill="#3ddc97"><title>Plaketatik: ${nf(r.self)} kWh</title></rect>`;
  s+=`<text x="${x+bw/2}" y="${H+14}" fill="var(--mute)" font-size="9" text-anchor="middle">${lbl(r.k)}</text>`});
 return s+`</svg><div class="lgd"><span><i style="background:#ffb627"></i>Saretik erosia</span><span><i style="background:#3ddc97"></i>Plaketatik (bertan kontsumitua)</span></div>`}
function combCards(){const places=[...new Set(meters.filter(m=>m.kind==="el"&&m.erol).map(m=>m.place||""))];
 return places.map(pl=>{const c=combFor(pl);if(!c)return "";const W=combAgg(c,wkStart),last=W[W.length-1];
  if(!last)return `<div class="cmb"><b>⚡ Kontsumo erreala${pl?" · "+esc(pl):""}</b><div class="note" style="margin:4px 0 0">Bi kontagailuen gutxienez bi irakurketa behar dira (egun berean hobeto).</div></div>`;
  const pct=last.real>0?Math.round(last.self/last.real*100):0;
  return `<button class="cmb" data-cmb="${esc(pl)}"><b>⚡ Kontsumo erreala${pl?" · "+esc(pl):""}</b><span class="cmv"><span><small>Aste honetan${last.n<7?" ("+last.n+" egun)":""}</small><b>${nf(last.real)} kWh</b></span><span><small>Saretik</small><b>${nf(last.g)}</b></span><span><small>Plakak</small><b style="color:var(--ok)">%${pct}</b></span></span></button>`}).join("")}
function combSheet(pl){const c=combFor(pl);if(!c)return;const W=combAgg(c,wkStart).slice(-10),M=combAgg(c,d=>d.slice(0,7)).slice(-12),pr=meters.find(m=>m.erol==="sarea"&&(m.place||"")===pl&&+m.price>0);
 sheet(`<h3>⚡ Kontsumo erreala${pl?" · "+esc(pl):""}</h3><div class="note">Kontsumo erreala = saretik erosia + plaken ekoizpena${c.X.length?" − sarera isuria":""}. Irakurketen arteko egunetan berdin banatuta.</div>
 <div class="card2"><b>Asteak</b>${combChart(W,k=>+k.slice(8)+"/"+(+k.slice(5,7)))}</div>
 <div class="card2"><b>Hilabeteak</b><div class="ctab"><div class="cth"><span>Hila</span><span>Erreala</span><span>Saretik</span><span>Plakak</span><span>%</span></div>${M.slice().reverse().map(r=>`<div><span>${HIL3[+r.k.slice(5)-1].replace(".","")} ${r.k.slice(2,4)}</span><span><b>${nf(r.real)}</b></span><span>${nf(r.g)}</span><span>${nf(r.p)}</span><span style="color:var(--ok)">${r.real>0?Math.round(r.self/r.real*100):0}</span></div>`).join("")}</div><div class="note" style="margin:6px 0 0">kWh${pr?` · saretik erosiaren kostua ≈ prezioa × kWh (${nf(+pr.price,3)} €/kWh)`:""}</div></div>
 <div class="acts"><span class="grow"></span><button class="btn" id="cbZ">Itxi</button></div>`);$("sheet").scrollTop=0;$("cbZ").onclick=close}
