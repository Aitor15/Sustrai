<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sustrai kontuak</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sustrai">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Diseinua: kontzertu-kartel itxura (beltza, zuria, gorria); goiburu beltz finkoa fitxekin; kontu-liburu erako errenkadak, mugikorrean pilatzen direnak. */
:root {
  --bg: #f4f3f1;
  --surface: #ffffff;
  --ink: #0d0d0d;
  --muted: #5f5f5f;
  --line: #e0dedb;
  --accent: #d0191c;
  --accent-soft: #fde3e2;
  --on-accent: #ffffff;
  --head-bg: #0d0d0d;
  --head-ink: #ffffff;
  --head-muted: #a6a6a6;
  --good: #1d7a45;
  --good-soft: #e1f2e7;
  --warn: #a35f06;
  --warn-soft: #fbefd9;
  --bad: #b3141a;
  --bad-soft: #fbe0e0;
  --info-soft: #ececec;
  --info: #3a3a3a;
  --font-display: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0b; --surface: #161616; --ink: #f2f2f2; --muted: #a3a3a3; --line: #2b2b2b;
    --accent: #ff3b3b; --accent-soft: #3a1414; --on-accent: #ffffff; --head-bg: #000000; --head-ink: #ffffff; --head-muted: #9a9a9a;
    --good: #5fcf8a; --good-soft: #15301f;
    --warn: #e8a94a; --warn-soft: #3a2c15; --bad: #ff6b6b; --bad-soft: #3d1a1a;
    --info-soft: #262626; --info: #d0d0d0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0b; --surface: #161616; --ink: #f2f2f2; --muted: #a3a3a3; --line: #2b2b2b;
  --accent: #ff3b3b; --accent-soft: #3a1414; --on-accent: #ffffff; --head-bg: #000000; --head-ink: #ffffff; --head-muted: #9a9a9a;
  --good: #5fcf8a; --good-soft: #15301f;
  --warn: #e8a94a; --warn-soft: #3a2c15; --bad: #ff6b6b; --bad-soft: #3d1a1a;
  --info-soft: #262626; --info: #d0d0d0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

header.top { background: var(--head-bg); color: var(--head-ink); border-bottom: 4px solid var(--accent); position: sticky; top: 0; z-index: 5; }
.top-inner { max-width: 1000px; margin: 0 auto; padding: 14px 16px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .04em; margin: 0; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand .sub { color: var(--head-muted); font-size: 13px; }
.year { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--head-muted); }
header.top .btn { background: transparent; color: var(--head-ink); border-color: #4a4a4a; }
header.top .btn:hover { border-color: var(--head-ink); }
.year select { padding: 5px 8px; border: 1px solid #4a4a4a; border-radius: 8px; background: var(--head-bg); color: var(--head-ink); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 10px 12px; border-bottom: 3px solid transparent; cursor: pointer; color: var(--head-muted); font-weight: 600; white-space: nowrap; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; font-size: 15px; margin-bottom: -4px; }
nav.tabs button[aria-selected="true"] { color: var(--head-ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-size: 12px; color: var(--head-muted); margin-left: 4px; }

main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 22px; }
.banner { padding: 10px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--ink); font-size: 14px; }
.banner[hidden] { display: none; }

h2 { font-family: var(--font-display); font-weight: 600; font-size: 21px; margin: 0; text-wrap: balance; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .label { font-size: 13px; color: var(--muted); }
.tile .value { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .foot { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile.hero { background: var(--head-bg); border-color: var(--head-bg); border-left: 5px solid var(--accent); }
.tile.hero .label, .tile.hero .foot { color: var(--head-muted); }
.tile.hero .value { color: var(--head-ink); }
.tile.neg .value { color: var(--bad); }
.tile-btn { cursor: pointer; transition: border-color .15s; }
.tile-btn:hover { border-color: var(--muted); }
.tile-btn.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card-pad { padding: 14px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:focus-visible, nav.tabs button:focus-visible, .row:focus-visible, .pill:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Filas tipo libro de cuentas */
.ledger { list-style: none; margin: 0; padding: 0; }
.ledger-head, .row { display: grid; grid-template-columns: var(--cols); gap: 10px; align-items: center; padding: 10px 14px; }
.ledger-head { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
.row { border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.row .main { font-weight: 500; overflow-wrap: anywhere; }
.row .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.r { text-align: right; }
.only-m { display: none; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }
.ledger-foot { display: grid; grid-template-columns: var(--cols); gap: 10px; padding: 10px 14px; border-top: 2px solid var(--line); font-weight: 600; }

.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 0; cursor: pointer; white-space: nowrap; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.neutral { background: var(--bg); color: var(--muted); }
.pill[disabled] { cursor: default; opacity: .6; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

/* Gráfico */
.chart-wrap { overflow-x: auto; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* Diálogo */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 13, .45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 20; overflow-y: auto; }
.overlay[hidden] { display: none; }
.dialog { background: var(--surface); border-radius: 14px; width: 100%; max-width: 520px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); display: grid; gap: 14px; }
.dialog h3 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: grid; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); width: 100%; }
.field textarea { min-height: 64px; resize: vertical; }
.field .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); }
.field .check input { width: auto; }
.calc { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: grid; gap: 2px; }
.calc div { display: flex; justify-content: space-between; }
.calc .tot { font-weight: 600; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.actions .spacer { flex: 1; }
.err { color: var(--bad); font-size: 13px; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; }
.toast[hidden] { display: none; }

@media (max-width: 640px) {
  .ledger-head { display: none; }
  .row, .ledger-foot { grid-template-columns: 1fr auto; }
  .row > .hide-m, .ledger-foot > .hide-m { display: none; }
  .only-m { display: inline; }
  .coche-detail { padding-left: 0; }
  .bolos-card .row, .bolos-card .ledger-foot { grid-template-columns: minmax(0,1fr) auto auto; }
  .form-grid { grid-template-columns: 1fr; }
  .brand h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.field.sep { font-family: var(--font-display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: fit-content; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 7px 18px; font-weight: 500; }
.seg input:checked + span { background: var(--ink); color: var(--surface); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.multi input { width: auto !important; flex: none; padding: 0; }
.multi { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.multi label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); cursor: pointer; }
.linkbtn { border: 0; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0 0 0 6px; text-decoration: underline; }
.row .meta .num, .r .meta { font-size: 12px; }
.coches { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.coche-row { display: grid; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.coche-row:last-child { border-bottom: 0; }
.coche-detail { display: grid; gap: 6px; padding-left: 24px; }
.coche-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.coche-row input[type=number], .coche-row input[type=text] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.coche-tray { flex: 1; min-width: 160px; }
.coche-row input[type=number] { width: 84px; }
.mini { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.coche-imp { margin-left: auto; font-weight: 600; }
.coche-links a { color: var(--accent); }
.del-confirm { display: inline-flex; gap: 4px; }
.pag-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pag-row label { font-size: 14px; color: var(--ink); }
.pag-row input { width: 110px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); text-align: right; }
.pag-tot { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }
.del-x { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.del-x:hover { color: var(--on-accent); background: var(--bad); border-color: var(--bad); }
.del-x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ap-toggle { color: var(--ink); font-weight: 500; cursor: pointer; }
.ap-toggle input { width: auto !important; }
.coche-row input:disabled { opacity: .45; }
.deudas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.deudas li { display: flex; gap: 8px; align-items: baseline; }
.deudas li .num { margin-left: auto; font-weight: 600; }
.deudas .arrow { color: var(--accent); font-weight: 700; }
.deudas li.pagado strong, .deudas li.pagado .num { color: var(--muted); text-decoration: line-through; }
.deudas li .pill { margin-left: 4px; }
.kitatuta { margin: 0; color: var(--good); font-weight: 600; }
.pago-ok { color: var(--good); }
.pago-pend { color: var(--warn); font-weight: 600; }
details summary { cursor: pointer; font-weight: 500; }
.bolo-liq { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
.bolo-liq:first-of-type { margin-top: 8px; }
.mes-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding: 6px 0 4px; border-bottom: 2px solid var(--ink); font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.mes-head .meta { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-weight: 400; }
.mes-head + .bolo-liq { border-top: 0; }
.card-pad > .mes-head:first-child { margin-top: 0; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); cursor: pointer; }
main, main section { grid-template-columns: minmax(0, 1fr); min-width: 0; }
main { overflow-x: clip; }
.ajustes-card > div > span.num { white-space: normal; text-align: right; }
.ajustes-card > div > span:first-child { flex: 0 1 auto; min-width: 0; }
.liq-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.liq-title .main { font-size: 16px; font-weight: 600; }
.liq-h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 8px; }
.liq-list { list-style: none; margin: 0; padding: 0 0 0 4px; display: grid; gap: 3px; }
.liq-list li { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 14px; }
.liq-list li .meta { font-size: 12px; }
.liq-tot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 6px; padding: 6px 8px; background: var(--bg); border-radius: 6px; font-size: 14px; }
.bolo-liq { gap: 4px; padding: 14px 0; }
.liq-grid { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 3px 16px; padding-left: 4px; font-size: 14px; align-items: baseline; }
.liq-grid .meta { font-size: 12px; }
.kid-table .r { text-align: center; }

/* Setlist */
.sl-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-height: 46vh; overflow-y: auto; }
.sl-list li { display: grid; grid-template-columns: 26px minmax(0,1fr) auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.sl-list li:last-child { border-bottom: 0; }
.sl-list li.sl-text .sl-name { font-style: italic; color: var(--muted); }
.sl-list li.sl-empty { display: block; padding: 12px; }
.sl-n { font-family: var(--font-display); font-weight: 700; color: var(--accent); text-align: right; }
.sl-name { overflow-wrap: anywhere; }
.sl-btns { display: inline-flex; gap: 3px; }
.sl-b { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; padding: 0; font-size: 14px; line-height: 1; }
.sl-b:disabled { opacity: .35; cursor: default; }
.sl-b.sl-x:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
.sl-total { font-size: 13px; color: var(--muted); text-align: right; margin-top: 4px; }
.sl-list li.sl-group { background: var(--surface); border-top: 2px solid var(--accent); }
.sl-list li.sl-group:first-child { border-top: 0; }
.sl-list li.sl-group .sl-name { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.sl-list li.sl-group .sl-n { color: var(--muted); }
.stage-list li.st-group { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; padding: 4px 0; border-bottom: 2px solid var(--accent); font-size: 22px; color: var(--accent); letter-spacing: .05em; }
.stage-list li.st-group:first-child { margin-top: 0; }
.stage-list li.st-group .st-meta { font-size: 15px; }
.rep-group { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 14px 6px; background: var(--bg); border-bottom: 1px solid var(--line); border-top: 2px solid var(--accent); font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 14px; }
.ledger .rep-group:first-child { border-top: 0; }
.rep-group .meta { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; }
.sl-groups { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.sl-list li.sl-addrow { display: block; padding: 5px 8px 7px 38px; background: var(--bg); }
.sl-list li.sl-addrow select { width: 100%; max-width: 100%; min-width: 0; padding: 5px 8px; border: 1px dashed var(--line); border-radius: 6px; background: var(--surface); color: var(--muted); font-size: 13px; }
.sl-add { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sl-add select, .sl-add input { flex: 1; min-width: 160px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.dialog { overflow-x: hidden; grid-template-columns: minmax(0, 1fr); }
/* Safari: grid eta flex barruko kutxak ez zabaltzeko testu luzeekin */
.form-grid > *, .field, .dialog .actions, .sl-add > *, .sl-list li > * { min-width: 0; }
.dialog .field select, .dialog .field input, .dialog .field textarea { width: 100%; }
.sl-add select { width: auto; max-width: 100%; text-overflow: ellipsis; }
.dialog input, .dialog select, .dialog textarea { max-width: 100%; min-width: 0; }
.dialog input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-height: 38px; }
@media (max-width: 640px) {
  /* 16px-tik behera, iPhoneak handitu egiten du idazten hastean eta koadroak ateratzen dira */
  input, select, textarea { font-size: 16px !important; }
  .sl-add select, .sl-add input { min-width: 0; flex: 1 1 140px; }
  .sl-list li { grid-template-columns: 22px minmax(0,1fr) auto; }
  .sl-list li .sl-btns { grid-column: 2 / -1; justify-self: end; }
  .dialog { padding: 16px; }
}
.dialog.stage-dialog { max-width: 760px; background: #0d0d0d; color: #fff; }
.stage-dialog .meta { color: #a6a6a6; }
.stage-title { font-family: var(--font-display); font-size: 34px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-bottom: 4px solid var(--accent); padding-bottom: 6px; margin-bottom: 4px; }
.stage-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.stage-list li { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid #2b2b2b; font-family: var(--font-display); font-size: 30px; font-weight: 700; text-transform: uppercase; line-height: 1.15; }
.stage-list .st-n { color: var(--accent); text-align: right; }
.stage-list .st-meta { font-size: 18px; color: #a6a6a6; font-weight: 500; text-transform: none; }
.stage-list li.st-text { font-size: 20px; color: #a6a6a6; font-weight: 500; }
.stage-dialog .btn { background: transparent; color: #fff; border-color: #4a4a4a; }
.stage-dialog .btn.primary { background: var(--accent); border-color: var(--accent); }
@media (max-width: 640px) { .stage-list li { font-size: 24px; grid-template-columns: 36px minmax(0,1fr) auto; } .stage-title { font-size: 26px; } }
@media print {
  body.printing-stage > *:not(.overlay) { display: none !important; }
  body.printing-stage .overlay { position: static; background: none; padding: 0; }
  body.printing-stage .dialog.stage-dialog { box-shadow: none; max-width: none; background: #fff; color: #000; }
  body.printing-stage .stage-list li { border-color: #ccc; color: #000; }
  body.printing-stage .stage-list .st-n { color: #000; }
  body.printing-stage .stage-list li.st-group { color: #000; border-color: #000; }
  body.printing-stage .stage-actions { display: none; }
}

<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div>
        <h1>Sustrai <span>· kontuak</span></h1>
        <div class="sub" id="sync-status">Konektatzen…</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <label class="year" for="year-select">Epea
          <select id="year-select"></select>
        </label>
        <button type="button" class="btn small" id="btn-ajustes">Ezarpenak</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main id="main">
  <div class="banner" id="banner" hidden></div>
  <div id="view"></div>
</main>

<div class="overlay" id="overlay" hidden>
  <form class="dialog" id="dialog" novalidate></form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  // ---------- Utilidades ----------
  const eur = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
  const money = (n) => eur.format(Number.isFinite(n) ? n : 0);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v) => { const n = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
  const has = (v) => v !== null && v !== undefined && v !== "";
  const round2 = (n) => Math.round(n * 100) / 100;
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const fdate = (s) => { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return "—"; const [y, m, d] = s.split("-"); return d + "/" + m + "/" + y; };
  const MESES = ["urt", "ots", "mar", "api", "mai", "eka", "uzt", "abu", "ira", "urr", "aza", "abe"];
  const $ = (id) => document.getElementById(id);
  const MESES_L = ["urtarrila", "otsaila", "martxoa", "apirila", "maiatza", "ekaina", "uztaila", "abuztua", "iraila", "urria", "azaroa", "abendua"];
  const mesLargo = (ym) => { if (!/^\d{4}-\d{2}$/.test(ym || "")) return "Datarik gabe"; const [y, m] = ym.split("-"); return y + "ko " + MESES_L[+m - 1]; };
  const sinAcentos = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const rutaPuntos = (t) => {
    const clean = (arr) => arr.map((x) => x.replace(/[^a-z0-9 -]/g, "").trim()).filter(Boolean);
    let p = clean(sinAcentos(t).split(/\s*[–—>→\/]\s*|\s+-\s+|\s+a\s+|\s+hasta\s+|\s+eta\s+/));
    if (p.length < 2) p = clean(sinAcentos(t).split("-"));
    return p;
  };
  const rutaKey = (t) => { const p = rutaPuntos(t); if (p.length < 2) return null; return p.slice().sort().join("__").replace(/ +/g, "-").slice(0, 180); };

  const TIPOS_GASTO = ["Coche (km + peajes)", "Peaje", "Parking", "Tren / bus", "Avión", "Hotel", "Dietas", "Otro"];
  const TIPO_EU = { "Coche (km + peajes)": "Autoa (km + bidesariak)", "Peaje": "Bidesaria", "Parking": "Aparkalekua", "Tren / bus": "Trena / autobusa", "Avión": "Hegazkina", "Hotel": "Hotela", "Dietas": "Dietak", "Otro": "Besterik" };
  const tipoEu = (t) => TIPO_EU[t] || t || "";
  const IVA_DEF = 21, EURKM_DEF = 0.26;
  const TARIFA_DEF = { factura: 1760, sinFactura: 1400, factura2: 2120, sinFactura2: 1760, extra: 125, pago1: 280, pago2: 352 };
  const tarifa = () => ({
    factura: has(state.ajustes.tarifaFactura) ? num(state.ajustes.tarifaFactura) : TARIFA_DEF.factura,
    sinFactura: has(state.ajustes.tarifaSinFactura) ? num(state.ajustes.tarifaSinFactura) : TARIFA_DEF.sinFactura,
    factura2: has(state.ajustes.tarifaFactura2) ? num(state.ajustes.tarifaFactura2) : TARIFA_DEF.factura2,
    sinFactura2: has(state.ajustes.tarifaSinFactura2) ? num(state.ajustes.tarifaSinFactura2) : TARIFA_DEF.sinFactura2,
    extra: has(state.ajustes.extraSinCena) ? num(state.ajustes.extraSinCena) : TARIFA_DEF.extra,
    pago1: has(state.ajustes.pago1) ? num(state.ajustes.pago1) : TARIFA_DEF.pago1,
    pago2: has(state.ajustes.pago2) ? num(state.ajustes.pago2) : TARIFA_DEF.pago2,
  });
  const esTarifa2 = (m) => String(m || "").endsWith("2");
  const pagoAuto = (m) => esTarifa2(m) ? tarifa().pago2 : tarifa().pago1;
  const MOD_KEY = { factura: "factura", sinfactura: "sinFactura", factura2: "factura2", sinfactura2: "sinFactura2" };
  const esSinFactura = (m) => String(m || "").startsWith("sinfactura");
  const precioAuto = (modalidad, cena) => (tarifa()[MOD_KEY[modalidad] || "factura"]) + (cena ? 0 : tarifa().extra);
  const modalidadOpts = () => { const t = tarifa(); return [
    ["factura", `Gipuzkoan · fakturarekin (${money(t.factura)} + BEZ)`],
    ["sinfactura", `Gipuzkoan · fakturarik gabe (${money(t.sinFactura)})`],
    ["factura2", `Gipuzkoatik kanpo · fakturarekin (${money(t.factura2)} + BEZ)`],
    ["sinfactura2", `Gipuzkoatik kanpo · fakturarik gabe (${money(t.sinFactura2)})`],
  ]; };

  // ---------- Estado ----------
  const state = {
    componentes: [], bolos: [], viajes: [], rutas: [], materiala: [], abestiak: [], setlistak: [],
    ajustes: { eurKm: EURKM_DEF },
    loaded: { componentes: false, bolos: false, viajes: false, rutas: false, materiala: false, abestiak: false, setlistak: false },
    year: "all", tab: "bolos", filtroComp: "all", canWrite: true, db: null, limited: true, filtroCobro: "all", myEmail: null, myId: null,
  };
  try { const y = localStorage.getItem("sustrai-year"); if (y) state.year = y; } catch (e) {}

  const TABS = [
    { id: "bolos", label: "Emanaldiak" },
    { id: "integrantes", label: "Kideen irabaziak" },
    { id: "viajes", label: "Bidaiak" },
    { id: "materiala", label: "Materiala" },
    { id: "setlist", label: "Setlist" },
    { id: "componentes", label: "Kideak" },
  ];
  const hashTab = () => { const h = location.hash.replace("#", ""); return TABS.some((t) => t.id === h) ? h : null; };
  state.tab = "bolos";
  try { if (location.hash) history.replaceState(null, "", location.pathname + location.search); } catch (er) {}

  // ---------- Cálculos ----------
  const inYear = (d) => state.year === "all" || (d && d.slice(0, 4) === state.year);
  const compName = (id) => { const c = state.componentes.find((x) => x.id === id); return c ? c.nombre : "(esleitu gabe)"; };
  const boloName = (id) => { const b = state.bolos.find((x) => x.id === id); return b ? (b.evento || b.cliente || "Emanaldia") + " · " + fdate(b.fecha) : ""; };
  const titulares = () => state.componentes.filter((c) => !c.ordezkoa);
  const compOpts = () => [...state.componentes].sort((a, b) => (!!a.ordezkoa - !!b.ordezkoa) || (a.nombre || "").localeCompare(b.nombre || "", "es")).map((c) => [c.id, c.nombre, !!c.ordezkoa, c.instrumento || ""]);
  const tocanDe = (b) => {
    const ids = Array.isArray(b.tocan) ? b.tocan.filter((id) => state.componentes.some((c) => c.id === id)) : null;
    return ids && ids.length ? ids : titulares().map((c) => c.id);
  };

  function boloCalc(b, viajes) {
    const facturado = !esSinFactura(b.modalidad);
    const ingreso = num(b.presupuesto);
    const iva = facturado ? round2(ingreso * IVA_DEF / 100) : 0;
    const irpf = 0;
    const aCobrar = round2(ingreso + iva);
    const tocan = tocanDe(b);
    const pagoBase = has(b.pagoIntegrante) ? num(b.pagoIntegrante) : pagoAuto(b.modalidad);
    const extraCena = b.cena === false ? (has(b.extraCena) ? num(b.extraCena) : tarifa().extra) : 0;
    const extraPor = tocan.length ? round2(extraCena / tocan.length) : 0;
    const porIntegrante = round2(pagoBase + extraPor);
    const pagos = round2(porIntegrante * tocan.length);
    const gestion = round2(ingreso - pagos);
    return { facturado, ingreso, iva, irpf, aCobrar, gestion, tocan, porIntegrante, pagos, pagoBase, extraCena, extraPor };
  }

  function viajesDeBolo(b) { return state.viajes.filter((v) => v.boloId === b.id); }
  function liquidar(bal) {
    const cred = [], deb = [];
    Object.entries(bal).forEach(([id, v]) => { const x = round2(v); if (x > 0.004) cred.push({ id, v: x }); else if (x < -0.004) deb.push({ id, v: -x }); });
    cred.sort((a, b) => b.v - a.v); deb.sort((a, b) => b.v - a.v);
    const out = []; let i = 0, j = 0;
    while (i < deb.length && j < cred.length) {
      const m = round2(Math.min(deb[i].v, cred[j].v));
      if (m > 0.004) out.push({ from: deb[i].id, to: cred[j].id, amount: m });
      deb[i].v = round2(deb[i].v - m); cred[j].v = round2(cred[j].v - m);
      if (deb[i].v <= 0.004) i++; if (cred[j].v <= 0.004) j++;
    }
    return out;
  }
  function afariGastuak(b) { return b && b.cena === false && b.afariOrdainketak && typeof b.afariOrdainketak === "object" ? Object.entries(b.afariOrdainketak).filter(([, x]) => num(x) > 0).map(([id, x]) => ({ componente: id, importe: num(x), afaria: true })) : []; }
  function boloViajes(b, viajes) {
    const vs = [...(viajes || viajesDeBolo(b)), ...afariGastuak(b)];
    const tocan = tocanDe(b);
    const total = round2(vs.reduce((s, v) => s + num(v.importe), 0));
    const share = tocan.length ? total / tocan.length : 0;
    const bal = {};
    tocan.forEach((id) => (bal[id] = -share));
    vs.forEach((v) => { if (!v.componente) return; bal[v.componente] = (bal[v.componente] || 0) + num(v.importe); });
    Object.keys(bal).forEach((k) => (bal[k] = round2(bal[k])));
    return { total, share: round2(share), n: tocan.length, bal, transfers: liquidar(bal) };
  }
  const transferHtml = (tr) => tr.length ? `<ul class="deudas">${tr.map((x) => `<li><strong>${esc(compName(x.from))}</strong> <span class="arrow" aria-label="ordaindu behar dio">→</span> <strong>${esc(compName(x.to))}</strong><span class="num">${money(x.amount)}</span></li>`).join("")}</ul>` : `<p class="meta" style="margin:0">Inork ez dio inori ezer zor.</p>`;

  function liqSecciones(b, l) {
    const vs = viajesDeBolo(b), af = afariGastuak(b);
    const row = (name, det, imp) => `<li><span><strong>${esc(name)}</strong>${det ? ` <span class="meta">· ${esc(det)}</span>` : ""}</span><span class="num">${money(imp)}</span></li>`;
    const autos = vs.filter((v) => v.tipo === TIPOS_GASTO[0]).sort((x, y) => compName(x.componente).localeCompare(compName(y.componente), "es"));
    const otros = vs.filter((v) => v.tipo !== TIPOS_GASTO[0]);
    const kmTxt = (v) => [v.trayecto, num(v.km) ? String(num(v.km)).replace(".", ",") + " km" : "", num(v.peajes) ? money(num(v.peajes)) + " bidesari" : ""].filter(Boolean).join(" · ");
    let h = "";
    if (autos.length) h += `<div class="liq-h">🚗 Autoa jarri dutenak</div><ul class="liq-list">${autos.map((v) => row(compName(v.componente), kmTxt(v), num(v.importe))).join("")}</ul>`;
    if (otros.length) h += `<div class="liq-h">Beste gastuak</div><ul class="liq-list">${otros.map((v) => row(compName(v.componente), [tipoEu(v.tipo), v.trayecto].filter(Boolean).join(" · "), num(v.importe))).join("")}</ul>`;
    if (af.length) h += `<div class="liq-h">🍽 Afaria/bazkaria ordaindu dutenak</div><ul class="liq-list">${af.slice().sort((x, y) => compName(x.componente).localeCompare(compName(y.componente), "es")).map((x) => row(compName(x.componente), "", x.importe)).join("")}</ul>`;
    h += `<div class="liq-tot"><span>Guztira ${money(l.total)} ÷ ${l.n} kide</span><strong class="num">${money(l.share)} bakoitzak</strong></div>`;
    const bc = boloCalc(b), betiko = round2(bc.porIntegrante - l.share);
    const ids = tocanDe(b).slice().sort((x, y) => compName(x).localeCompare(compName(y), "es"));
    h += `<div class="liq-h">💶 Irabaziak</div><div class="liq-grid"><span class="meta">Kidea</span><span class="meta r">Behin-behinekoa</span><span class="meta r">Behin betikoa</span>${ids.map((id) => `<span><strong>${esc(compName(id))}</strong></span><span class="num r">${money(bc.porIntegrante)}</span><span class="num r"><strong>${money(betiko)}</strong></span>`).join("")}</div>`;
    return h;
  }
  const payKey = (x) => x.from + "__" + x.to;
  const myComp = () => { if (window.sustraiMyComp && state.componentes.some((c) => c.id === window.sustraiMyComp)) return window.sustraiMyComp; if (!state.myEmail && !state.myId) return null; const c = state.componentes.find((c) => (state.myEmail && String(c.email || "").trim().toLowerCase() === state.myEmail) || (state.myId && c.uid === state.myId)); return c ? c.id : null; };
  const canPay = (x) => state.canWrite && (!state.limited || (myComp() && (x.from === myComp() || x.to === myComp())));
  function boloPagos(b, l) {
    const paid = (b && b.ordainduak) || {};
    const list = l.transfers.map((x) => { const p = num(paid[payKey(x)]); const rest = round2(Math.max(0, x.amount - p)); return { ...x, paid: rest <= 0.009, rest }; });
    return { list, pending: list.filter((x) => !x.paid), done: list.length > 0 && list.every((x) => x.paid) };
  }
  function boloEstadoPagos(b) { const l = boloViajes(b); if (!l.total || !l.transfers.length) return null; return boloPagos(b, l).done ? "ok" : "pend"; }

  function totals() {
    const bolos = state.bolos.filter((b) => inYear(b.fecha));
    const via = state.viajes.filter((v) => inYear(v.fecha));
    let presupuesto = 0, facturado = 0, cobrado = 0, pendiente = 0, iva = 0, irpf = 0, gestion = 0, pagos = 0;
    const porComp = {};
    state.componentes.forEach((c) => (porComp[c.id] = { ganancia: 0, bolos: 0 }));
    bolos.forEach((b) => {
      const c = boloCalc(b);
      presupuesto += num(b.presupuesto);
      if (c.facturado) { facturado += c.ingreso; iva += c.iva; irpf += c.irpf; }
      const importe = c.aCobrar;
      if (b.cobrado) cobrado += importe; else pendiente += importe;
      gestion += c.gestion; pagos += c.pagos;
      c.tocan.forEach((id) => { if (porComp[id]) { porComp[id].ganancia += c.porIntegrante; porComp[id].bolos++; } });
    });
    return { bolos, via, presupuesto, facturado, cobrado, pendiente, iva, irpf, gestion, pagos, porComp };
  }

  // ---------- Pestañas y periodo ----------
  function renderTabs() {
    if (state.limited) { $("tabs").innerHTML = ""; return; }
    const counts = { setlist: state.setlistak.length, materiala: state.materiala.filter((m) => inYear(m.fecha)).length, bolos: state.bolos.filter((b) => inYear(b.fecha)).length, viajes: state.viajes.filter((v) => inYear(v.fecha)).length, componentes: state.componentes.length };
    $("tabs").innerHTML = TABS.map((t) => `<button role="tab" id="tab-${t.id}" aria-selected="${t.id === state.tab}" data-tab="${t.id}">${t.label}${counts[t.id] != null ? `<span class="count">${counts[t.id]}</span>` : ""}</button>`).join("");
  }
  function renderYears() {
    const ys = new Set();
    [...state.viajes, ...state.bolos, ...state.materiala].forEach((x) => { if (x.fecha && /^\d{4}/.test(x.fecha)) ys.add(x.fecha.slice(0, 4)); });
    const list = [...ys].sort().reverse();
    if (state.year !== "all" && !list.includes(state.year)) { if (state.loaded.bolos) { state.year = "all"; try { localStorage.setItem("sustrai-year", "all"); } catch (er) {} } else list.unshift(state.year); }
    $("year-select").innerHTML = `<option value="all">Guztia</option>` + list.map((y) => `<option value="${y}">${y}</option>`).join("");
    $("year-select").value = state.year;
  }
  $("btn-ajustes").addEventListener("click", () => { if (!state.db) return toast("Ikuspegi honetan ezin dira ezarpenak gorde."); openAjustes(); });
  $("year-select").addEventListener("change", (e) => { state.year = e.target.value; try { localStorage.setItem("sustrai-year", state.year); } catch (er) {} render(); });
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; goTab(b.dataset.tab); });
  function goTab(t) { state.tab = t; try { history.replaceState(null, "", "#" + t); } catch (er) {} render(); }
  window.addEventListener("hashchange", () => { const t = hashTab(); if (t && t !== state.tab) { state.tab = t; render(); } });

  // ---------- Vistas ----------
  function render() {
    if (state.limited) state.tab = "integrantes";
    $("btn-ajustes").style.display = state.limited ? "none" : "";
    renderYears();
    renderTabs();
    const v = { bolos: viewBolos, integrantes: viewIntegrantes, viajes: viewViajes, materiala: viewMateriala, setlist: viewSetlist, componentes: viewComponentes }[state.tab];
    $("view").innerHTML = v();
  }
  const periodoTxt = () => state.year === "all" ? "epe osoa" : state.year;
  const addBtn = (kind, label) => state.canWrite ? `<button type="button" class="btn primary" data-add="${kind}">+ ${label}</button>` : "";
  const loadingOr = (key, html) => state.loaded[key] ? html : `<div class="card empty">Kargatzen…</div>`;
  const noComps = () => `<div class="card empty"><strong>Lehenik, gehitu taldeko kideak</strong>Horrela, aplikazioak kalkula dezake bakoitzak zenbat kobratzen duen.<div style="margin-top:12px">${addBtn("componente", "Gehitu kidea")}</div></div>`;

  function tiles(t) {
    return `<div class="tiles">
      <div class="tile hero"><div class="label">Kideentzat</div><div class="value">${money(t.pagos)}</div><div class="foot">Finkoa, emanaldi eta pertsonako</div></div>
      <div class="tile"><div class="label">Artistamente</div><div class="value">${money(t.gestion)}</div><div class="foot">Aurrekontua ken kideak</div></div>
      <div class="tile"><div class="label">Aurrekontuak</div><div class="value">${money(t.presupuesto)}</div><div class="foot">${t.bolos.length} emanaldi</div></div>
      <div class="tile tile-btn${state.filtroCobro === "fac" ? " on" : ""}" role="button" tabindex="0" data-filtro-cobro="fac" title="Ikusi fakturarekin egindako emanaldiak"><div class="label">BEZ (%${IVA_DEF}) ›</div><div class="value">${money(t.iva)}</div><div class="foot">${t.bolos.filter((b) => boloCalc(b).facturado).length} emanaldi fakturarekin</div></div>
      ${(() => { const sf = t.bolos.filter((b) => !boloCalc(b).facturado); return `<div class="tile tile-btn${state.filtroCobro === "sinfac" ? " on" : ""}" role="button" tabindex="0" data-filtro-cobro="sinfac" title="Ikusi fakturarik gabeko emanaldiak"><div class="label">BEZ gabe ›</div><div class="value">${money(sf.reduce((a, b) => a + num(b.presupuesto), 0))}</div><div class="foot">${sf.length} emanaldi fakturarik gabe</div></div>`; })()}
      ${(() => { const fb = t.bolos.filter((b) => boloCalc(b).facturado), fp = fb.filter((b) => !b.facturaEmitida); return `<div class="tile tile-btn${state.filtroCobro === "facpend" ? " on" : ""}" role="button" tabindex="0" data-filtro-cobro="facpend" title="Ikusi faktura egin gabeko emanaldiak"><div class="label">Faktura egiteko ›</div><div class="value" style="color:${fp.length ? "var(--warn)" : "var(--good)"}">${fp.length ? fp.length + " emanaldi" : "✓ Denak"}</div><div class="foot">${fb.length - fp.length} / ${fb.length} faktura emanda</div></div>`; })()}
      <div class="tile tile-btn${state.filtroCobro === "si" ? " on" : ""}" role="button" tabindex="0" data-filtro-cobro="si" title="Ikusi kobratutako emanaldiak"><div class="label">Kobratuta ›</div><div class="value">${money(t.cobrado)}</div><div class="foot">${t.bolos.filter((b) => b.cobrado).length} emanaldi kobratuta</div></div>
      <div class="tile tile-btn${state.filtroCobro === "no" ? " on" : ""}" role="button" tabindex="0" data-filtro-cobro="no" title="Ikusi kobratu gabeko emanaldiak"><div class="label">Kobratzeko ›</div><div class="value" style="color:${t.pendiente > 0 ? "var(--warn)" : "inherit"}">${money(t.pendiente)}</div><div class="foot">${t.bolos.filter((b) => !b.cobrado).length} emanaldi kobratu gabe</div></div>
    </div>`;
  }

  // ---------- Ordainketa berrien abisua (adminarentzat, gailu bakoitzean) ----------
  const SEEN_KEY = "sustrai-ordainketak-ikusita";
  function pagosAhora() {
    const m = {};
    state.bolos.forEach((b) => { const l = boloViajes(b); if (!l.total) return; boloPagos(b, l).list.forEach((x) => { m[b.id + "|" + payKey(x)] = { paid: x.paid, x, b }; }); });
    return m;
  }
  function leerVisto() { try { const v = localStorage.getItem(SEEN_KEY); return v ? JSON.parse(v) : null; } catch (er) { return undefined; } }
  function guardarVisto(seen) { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (er) {} }
  function marcarVisto(keys, paid) { const seen = leerVisto(); if (!seen) return; keys.forEach((k) => { if (paid) seen[k] = 1; else delete seen[k]; }); guardarVisto(seen); }
  function visto(now) { const seen = {}; Object.entries(now).forEach(([k, v]) => { if (v.paid) seen[k] = 1; }); guardarVisto(seen); }
  function novedadesPago() {
    if (state.limited || !state.loaded.bolos || !state.loaded.viajes || !state.loaded.componentes) return [];
    const seen = leerVisto(); if (seen === undefined) return [];
    const now = pagosAhora();
    if (seen === null) { visto(now); return []; }
    return Object.entries(now).filter(([k, v]) => v.paid !== !!seen[k]).map(([, v]) => v)
      .sort((a, c) => (c.b.fecha || "").localeCompare(a.b.fecha || ""));
  }
  function avisoPagos() {
    const n = novedadesPago(); if (!n.length) return "";
    const nuevos = n.filter((v) => v.paid).length;
    return `<div class="banner" style="background:var(--good-soft);display:grid;gap:8px;margin-bottom:14px">
      <strong>🔔 ${nuevos ? `${nuevos} ordainketa berri` : "Aldaketak ordainketetan"} azken aldiz sartu zinenetik</strong>
      <ul class="deudas">${n.map((v) => `<li><span>${v.paid ? "✓" : "↩"}</span> <span><strong>${esc(compName(v.x.from))}</strong> → <strong>${esc(compName(v.x.to))}</strong> <span class="meta">· ${esc(v.b.evento || "Emanaldia")} ${fdate(v.b.fecha)}${v.paid ? "" : " · ordaindu gabe gisa markatuta"}</span></span><span class="num">${money(v.x.amount)}</span></li>`).join("")}</ul>
      <div><button type="button" class="btn small" data-pagos-visto>Ados, ikusita</button></div>
    </div>`;
  }
  // ---------- Emanaldi berrien abisua (kideentzat, gailu bakoitzean) ----------
  const SEEN_B = "sustrai-emanaldiak-ikusita";
  function avisoEmanaldiak() {
    if (!state.limited || !myComp() || !state.loaded.bolos) return "";
    let seen; try { const v = localStorage.getItem(SEEN_B); seen = v ? JSON.parse(v) : null; } catch (er) { return ""; }
    const ids = state.bolos.map((b) => b.id);
    if (!seen) { try { localStorage.setItem(SEEN_B, JSON.stringify(ids)); } catch (er) {} return ""; }
    const nuevos = state.bolos.filter((b) => !seen.includes(b.id)).sort((a, c) => (a.fecha || "").localeCompare(c.fecha || ""));
    if (!nuevos.length) return "";
    return `<div class="banner" style="background:var(--accent-soft);display:grid;gap:8px">
      <strong>🎵 ${nuevos.length === 1 ? "Emanaldi berria" : nuevos.length + " emanaldi berri"}!</strong>
      <ul class="deudas">${nuevos.map((b) => `<li><span><strong>${esc(b.evento || "Emanaldia")}</strong> <span class="meta">· ${fdate(b.fecha)}${b.cliente ? " · " + esc(b.cliente) : ""}</span></span></li>`).join("")}</ul>
      <div><button type="button" class="btn small" data-emanaldi-visto>Ados, ikusita</button></div>
    </div>`;
  }
  function viewBolos() {
    if (state.loaded.componentes && !state.componentes.length) return `<section style="display:grid;gap:12px"><h2>Emanaldiak</h2>${noComps()}</section>`;
    const t = totals();
    const list = [...t.bolos].filter((b) => state.filtroCobro === "all" || (state.filtroCobro === "facpend" ? boloCalc(b).facturado && !b.facturaEmitida : state.filtroCobro === "fac" ? boloCalc(b).facturado : state.filtroCobro === "sinfac" ? !boloCalc(b).facturado : state.filtroCobro === "si" ? !!b.cobrado : !b.cobrado)).sort((a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999"));
    const cols = "minmax(0,1fr) 130px 130px 110px";
    let sp = 0, sc = 0, sg = 0;
    const rows = list.map((b) => {
      const pedido = num(b.presupuesto);
      const c = boloCalc(b);
      sp += pedido; if (b.cobrado) sc += pedido; sg += c.gestion;
      return `
        <li class="row" tabindex="0" data-edit="bolo" data-id="${esc(b.id)}">
          <div><div class="main">${esc(b.evento || "Lekurik gabeko emanaldia")}</div>
            <div class="meta">${fdate(b.fecha)}${b.cliente ? " · " + esc(b.cliente) : ""}${b.clienteEmail ? ` · <a href="mailto:${esc(b.clienteEmail)}" style="color:inherit">✉ ${esc(b.clienteEmail)}</a>` : ""}${c.facturado ? (b.facturaEmitida ? ` · <span class="pago-ok">faktura${b.facturaNum ? " " + esc(b.facturaNum) : ""} emanda ✓</span>` : ` · <span class="pago-pend">faktura egin gabe</span>${state.canWrite ? ` <button type="button" class="linkbtn" data-toggle-fact="${esc(b.id)}">emanda markatu</button>` : ""}`) : ""}${b.cena === false ? " · afaririk gabe (+" + money(tarifa().extra) + ")" + (afariGastuak(b).length ? ", afaria: " + esc(afariGastuak(b).map((x) => compName(x.componente) + " " + money(x.importe)).join(", ")) : "") : b.cena === "zehazteko" ? ' · <span class="pago-pend">afaria zehazteko</span>' : ""}${(() => { const e = boloEstadoPagos(b); return e === "ok" ? ' · <span class="pago-ok">bidaiak kitatuta ✓</span>' : e === "pend" ? ' · <span class="pago-pend">bidaiak kitatu gabe</span>' : ""; })()}<span class="only-m"> · kudeaketa ${money(c.gestion)}</span></div></div>
          <div class="r"><div class="num"><strong>${money(pedido)}</strong></div><div class="meta">${b.modalidad && b.modalidad.endsWith("2") ? "Gipuzkoatik kanpo · " : ""}${c.facturado ? "+ BEZ" : "fakturarik gabe"}</div></div>
          <div class="r num hide-m" style="color:${c.gestion < 0 ? "var(--bad)" : "inherit"}">${money(c.gestion)}</div>
          <div class="r"><button type="button" class="pill ${b.cobrado ? "ok" : "warn"}" data-toggle-cobro="${esc(b.id)}" ${state.canWrite ? "" : "disabled"} title="Aldatu">${b.cobrado ? "Bai" : "Ez"}</button></div>
        </li>`;
    }).join("");
    const body = list.length ? `
      <div class="card bolos-card" style="--cols:${cols}">
        <div class="ledger-head"><div>Emanaldiaren lekua</div><div class="r">Aurrekontua</div><div class="r hide-m">Kudeaketa</div><div class="r">Kobratuta</div></div>
        <ul class="ledger">${rows}</ul>
        <div class="ledger-foot"><div>Guztira (${esc(periodoTxt())}) · kobratuta ${money(sc)}</div><div class="r num">${money(sp)}</div><div class="r num hide-m">${money(sg)}</div><div class="r num" style="color:${sp - sc > 0 ? "var(--warn)" : "inherit"}">${sp - sc > 0 ? "falta: " + money(sp - sc) : ""}</div></div>
      </div>`
      : state.filtroCobro !== "all" ? `<div class="card empty"><strong>${state.filtroCobro === "facpend" ? "Faktura guztiak emanda ✓" : state.filtroCobro === "si" ? "Ez dago emanaldi kobraturik" : state.filtroCobro === "fac" ? "Ez dago fakturarekin egindako emanaldirik" : state.filtroCobro === "sinfac" ? "Ez dago fakturarik gabeko emanaldirik" : "Dena kobratuta ✓"} (${esc(periodoTxt())})</strong></div>` : `<div class="card empty"><strong>Ez dago emanaldirik (${esc(periodoTxt())})</strong>Idatzi emanaldi bakoitzaren lekua eta aurrekontua.</div>`;
    return `${avisoPagos()}${tiles(t)}
      <section style="display:grid;gap:12px">
        <div class="section-head"><div><h2>Emanaldiak</h2><p class="hint">Sakatu "Bai / Ez" kobratuta dagoen markatzeko. Kudeaketa = BEZik gabeko aurrekontua ken kideei ordaintzen zaiena.</p></div>${addBtn("bolo", "Emanaldi berria")}</div>
        ${state.filtroCobro !== "all" ? `<div class="filters" id="bolos-list"><span class="pill ${state.filtroCobro === "si" ? "ok" : state.filtroCobro === "fac" || state.filtroCobro === "sinfac" ? "info" : "warn"}" style="cursor:default">${state.filtroCobro === "facpend" ? "Faktura egin gabeak bakarrik" : state.filtroCobro === "si" ? "Kobratutakoak bakarrik" : state.filtroCobro === "fac" ? "Fakturarekin bakarrik" : state.filtroCobro === "sinfac" ? "Fakturarik gabe bakarrik" : "Kobratu gabeak bakarrik"} · ${list.length}</span><button type="button" class="linkbtn" data-filtro-cobro="all">Ikusi guztiak</button></div>` : `<div id="bolos-list"></div>`}
        ${loadingOr("bolos", body)}
      </section>`;
  }

  function viewIntegrantes() {
    if (state.loaded.componentes && !state.componentes.length) return `<section style="display:grid;gap:12px"><h2>Kideen irabaziak</h2>${noComps()}</section>`;
    const t = totals();
    const cols = "minmax(0,.8fr) 80px 1fr 1fr 1fr 1fr 1fr";
    const balG = {}, balV = {}, balA = {}, cuotaG = {}, pendG = {}, porBolo = [];
    const sumaBal = (acc, b, vs) => {
      const tocan = tocanDe(b), tot = vs.reduce((s, v) => s + num(v.importe), 0);
      if (!tot || !tocan.length) return;
      const share = tot / tocan.length;
      tocan.forEach((id) => (acc[id] = (acc[id] || 0) - share));
      vs.forEach((v) => { if (v.componente) acc[v.componente] = (acc[v.componente] || 0) + num(v.importe); });
    };
    [...t.bolos].sort((a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999")).forEach((b) => {
      const l = boloViajes(b);
      if (!l.total) return;
      const pg = boloPagos(b, l);
      porBolo.push({ b, l, pg });
      pg.pending.forEach((x) => { pendG[x.from] = round2((pendG[x.from] || 0) - x.rest); pendG[x.to] = round2((pendG[x.to] || 0) + x.rest); });
      Object.entries(l.bal).forEach(([id, v]) => (balG[id] = round2((balG[id] || 0) + v)));
      sumaBal(balV, b, viajesDeBolo(b)); sumaBal(balA, b, afariGastuak(b));
      tocanDe(b).forEach((id) => (cuotaG[id] = round2((cuotaG[id] || 0) + l.share)));
    });
    const deudas = liquidar(pendG);
    const meses = [];
    porBolo.forEach(({ b, pg }) => {
      if (!pg.pending.length) return;
      const m = (b.fecha || "").slice(0, 7);
      let e = meses.find((x) => x.m === m); if (!e) { e = { m, bal: {}, n: 0 }; meses.push(e); }
      e.n++;
      pg.pending.forEach((x) => { e.bal[x.from] = round2((e.bal[x.from] || 0) - x.rest); e.bal[x.to] = round2((e.bal[x.to] || 0) + x.rest); });
    });
    meses.forEach((e) => (e.tr = liquidar(e.bal)));
    const nPend = porBolo.filter((x) => x.pg.pending.length).length;
    const rows = state.componentes.map((c) => {
      const pc = t.porComp[c.id] || { ganancia: 0, bolos: 0 };
      const pend = round2(balV[c.id] || 0);
      const afari = round2(balA[c.id] || 0);
      const cuota = round2(cuotaG[c.id] || 0);
      return { c, ...pc, pend, afari, total: round2(pc.ganancia + pend + afari), cuota, neto: round2(pc.ganancia - cuota) };
    }).sort((a, b) => (!!a.c.ordezkoa - !!b.c.ordezkoa) || (a.c.nombre || "").localeCompare(b.c.nombre || "", "es"));
    const sum = rows.reduce((s, r) => ({ g: s.g + r.ganancia, p: s.p + r.pend, a: s.a + r.afari, t: s.t + r.total, n: s.n + r.neto }), { g: 0, p: 0, a: 0, t: 0, n: 0 });
    const signed = (v) => `<div class="r num hide-m" style="color:${v < 0 ? "var(--bad)" : v > 0 ? "var(--good)" : "inherit"}">${v > 0 ? "+" : ""}${money(v)}</div>`;
    return `
      ${state.limited ? "" : `<section style="display:grid;gap:12px">
        <div class="section-head"><div><h2>Kideen irabaziak · ${esc(periodoTxt())}</h2><p class="hint">Kide bakoitzak kopuru finkoa kobratzen du emanaldiko: ${money(tarifa().pago1)} Gipuzkoan eta ${money(tarifa().pago2)} Gipuzkoatik kanpo. Aurrekontuaren gainerakoa kudeaketa gastuak dira.</p></div></div>
        <div class="card kid-table" style="--cols:${cols}">
          <div class="ledger-head"><div>Kidea</div><div class="r hide-m">Emanaldiak</div><div class="r">Behin-behineko irabazia</div><div class="r hide-m">Bidaien doikuntza</div><div class="r hide-m">Bazkari/afari doikuntza</div><div class="r hide-m">Jasotzekoa guztira</div><div class="r">Behin betiko irabazia</div></div>
          <ul class="ledger">${rows.map((r, i) => `${r.c.ordezkoa && (i === 0 || !rows[i - 1].c.ordezkoa) ? `<li class="ledger-head" style="border-top:2px solid var(--line)"><div>Ordezkoak</div></li>` : ""}
            <li class="row" tabindex="0" data-goto-comp="${esc(r.c.id)}">
              <div><div class="main">${esc(r.c.nombre)}</div><div class="meta">${esc(r.c.instrumento || "")}<span class="only-m">${r.c.instrumento ? " · " : ""}${r.bolos} emanaldi · behin-behineko irabazia ${money(r.ganancia)} · bidaiak ${r.pend > 0 ? "+" : ""}${money(r.pend)}${r.afari ? ` · bazkari/afaria ${r.afari > 0 ? "+" : ""}${money(r.afari)}` : ""} · jasotzekoa ${money(r.total)}</span></div></div>
              <div class="r num hide-m">${r.bolos}</div>
              <div class="r num hide-m">${money(r.ganancia)}</div>
              ${signed(r.pend)}
              ${signed(r.afari)}
              <div class="r num hide-m">${money(r.total)}</div>
              <div class="r num"><strong>${money(r.neto)}</strong></div>
            </li>`).join("")}
          </ul>
          <div class="ledger-foot"><div>Guztira</div><div class="hide-m"></div><div class="r num hide-m">${money(sum.g)}</div><div class="r num hide-m">${money(sum.p)}</div><div class="r num hide-m">${money(sum.a)}</div><div class="r num hide-m">${money(sum.t)}</div><div class="r num">${money(sum.n)}</div></div>
        </div>
        <p class="hint">Emanaldi bakoitzeko bidaiak (eta kideek ordaindutako afariak) jo zuten guztien artean ordaintzen dira, zati berdinetan. "Bidaien doikuntza" eta "Bazkari/afari doikuntza" bakoitzak jartzen duena (−) edo berreskuratzen duena (+) da. "Jasotzekoa guztira" = bere ordainketa gehi bi doikuntza horiek. "Behin betiko irabazia" = bidaiak eta bazkari/afariak ordaindu ondoren poltsikoan geratzen zaiona (behin-behineko irabazia ken bidaietan eta otorduetan dagokion zatia).</p>
      </section>
      `}
      ${avisoEmanaldiak()}
      ${state.limited ? (() => { const mc = myComp(); return mc && !state.canWrite ? `<div class="banner">Kaixo, <strong>${esc(compName(mc))}</strong>! Oraingoz ezin duzu ezer markatu: zure sarbidea irakurtzeko bakarrik da. Eskatu arduradunari <strong>Editore</strong> sarbidea.</div>` : mc ? `<div class="banner" style="background:var(--good-soft)">Kaixo, <strong>${esc(compName(mc))}</strong>! Zure ordainketak bakarrik marka ditzakezu (zuk ordaintzen dituzunak edo zuri ordaintzen dizkizutenak).</div>` : state.myId && state.canWrite ? (() => { const libres = [...state.componentes].filter((c) => !c.admin).sort((x, y) => (x.nombre || "").localeCompare(y.nombre || "", "es")); return `<div class="banner" style="display:grid;gap:8px"><span><strong>Nor zara?</strong> Aukeratu zure izena eta idatzi Aitorrek emandako PINa. Behin bakarrik egin behar da gailu bakoitzean.</span><span style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="claim-sel" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"><option value="">Aukeratu…</option>${libres.map((c) => `<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join("")}</select><input id="claim-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PINa" style="width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"><button type="button" class="btn small primary" data-claim>Ni naiz</button></span></div>`; })() : `<div class="banner">Ezin izan da jakin nor zaren. Ordainketak markatzeko, eskatu aplikazioaren arduradunari editatzeko sarbidea.</div>`; })() : ""}
      <section style="display:grid;gap:10px">
        <div class="section-head"><div><h2>Nork nori zor dio · ${esc(periodoTxt())}</h2><p class="hint">Oraindik egin gabe dauden ordainketak, gutxienera bilduta. "A → B": A-k B-ri ordaindu behar dio. Hilabeteka bilduta daude. Ordaindutakoan, markatu hilabetea, emanaldi bakoitza edo dena batera.</p></div>${porBolo.length || state.viajes.some((v) => inYear(v.fecha)) ? `<button type="button" class="btn" data-pdf>PDF deskargatu</button>` : ""}</div>
        <div class="card card-pad" style="display:grid;gap:10px">${!porBolo.length ? `<p class="meta" style="margin:0">Epe honetako emanaldietan ez dago bidaiarik idatzita.</p>`
          : deudas.length ? `${meses.map((e) => `<div class="mes-head"><span>${esc(mesLargo(e.m))}</span><span class="meta">${e.n} emanaldi kitatu gabe</span></div>${transferHtml(e.tr)}${state.canWrite && !state.limited ? `<div><button type="button" class="btn small" data-pay-month="${esc(e.m)}">${esc(mesLargo(e.m))} ordainduta</button></div>` : ""}`).join("")}
            ${meses.length > 1 ? `<div class="mes-head"><span>Guztira, hilabeteak batuta</span><span class="meta">ordainketa gutxiago</span></div>${transferHtml(deudas)}` : ""}
            ${state.canWrite && !state.limited ? `<div id="payall-box"><button type="button" class="btn small" data-pay-all>Dena ordainduta markatu</button></div>` : ""}`
          : `<p class="kitatuta">✓ Dena kitatuta. Inork ez dio inori ezer zor.</p>`}</div>
        ${porBolo.length ? `<details class="card card-pad" ${nPend ? "open" : ""}><summary>Emanaldiz emanaldi · ${nPend ? nPend + " kitatu gabe" : "denak kitatuta"}</summary>${porBolo.map(({ b, l, pg }, i) => `${(() => { const m = (b.fecha || "").slice(0, 7), prevM = i ? (porBolo[i - 1].b.fecha || "").slice(0, 7) : null; if (m === prevM) return ""; const enMes = porBolo.filter((x) => (x.b.fecha || "").slice(0, 7) === m); const np = enMes.filter((x) => x.pg.pending.length).length; return `<div class="mes-head"><span>${esc(mesLargo(m))}</span><span class="meta">${enMes.length} emanaldi · ${np ? np + " kitatu gabe" : "denak kitatuta ✓"}</span></div>`; })()}
          <div class="bolo-liq"><div class="liq-title"><span class="main">${esc(b.evento || "Emanaldia")} · ${fdate(b.fecha)}</span> ${pg.done ? `<span class="pill ok">Kitatuta</span>` : `<span class="pill warn">Kitatu gabe</span>`}</div>
          ${liqSecciones(b, l)}
          <div class="liq-h">Ordainketak</div>

            <button type="button" class="pill ${x.paid ? "ok" : "neutral"}" data-pay="${esc(b.id)}" data-key="${esc(payKey(x))}" data-amount="${x.amount}" ${canPay(x) ? "" : "disabled"} title="${canPay(x) ? "Aldatu" : "Zure ordainketak bakarrik marka ditzakezu"}">${x.paid ? "✓ Ordainduta" : "Ordaindu gabe"}</button></li>`).join("")}</ul>` : `<p class="meta" style="margin:0">Inork ez dio inori ezer zor.</p>`}
          </div>`).join("")}</details>` : ""}
      </section>
      <section style="display:grid;gap:10px"><h2>Hilabeteko banaketa</h2><div class="card card-pad">${chart()}</div></section>
`;
  }

  function chart() {
    const months = [];
    if (state.year === "all") {
      const d = new Date();
      for (let i = 11; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); months.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0")); }
    } else for (let m = 1; m <= 12; m++) months.push(state.year + "-" + String(m).padStart(2, "0"));
    const ing = months.map((m) => state.bolos.filter((b) => (b.fecha || "").slice(0, 7) === m).reduce((s, b) => s + boloCalc(b).pagos, 0));
    const gas = months.map((m) => state.bolos.filter((b) => (b.fecha || "").slice(0, 7) === m).reduce((s, b) => s + boloCalc(b).gestion, 0));
    const max = Math.max(...ing, ...gas, 0);
    if (max === 0) return `<div class="empty" style="padding:14px"><strong>Ez dago mugimendurik epe honetan</strong>Emanaldiak idazten dituzunean, hilabete bakoitza hemen ikusiko duzu.</div>`;
    const step = niceStep(max), top = Math.ceil(max / step) * step;
    const W = 720, H = 220, L = 56, R = 8, T = 10, B = 26;
    const cw = (W - L - R) / months.length, bw = Math.min(16, cw / 3);
    const y = (v) => T + (H - T - B) * (1 - v / top);
    let g = "";
    for (let v = 0; v <= top + 0.001; v += step) {
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
      g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${shortMoney(v)}</text>`;
    }
    months.forEach((m, i) => {
      const cx = L + cw * i + cw / 2, [yy, mm] = m.split("-");
      g += `<rect x="${cx - bw - 1}" y="${y(ing[i])}" width="${bw}" height="${Math.max(0, y(0) - y(ing[i]))}" rx="2" fill="var(--accent)"><title>${MESES[+mm - 1]} ${yy} · kideak ${money(ing[i])}</title></rect>`;
      g += `<rect x="${cx + 1}" y="${y(gas[i])}" width="${bw}" height="${Math.max(0, y(0) - y(gas[i]))}" rx="2" fill="var(--muted)"><title>${MESES[+mm - 1]} ${yy} · kudeaketa ${money(gas[i])}</title></rect>`;
      g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MESES[+mm - 1]}</text>`;
    });
    return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px;display:block" role="img" aria-label="Hilabeteko banaketa">${g}</svg></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Kideentzat</span><span><i style="background:var(--muted)"></i>Kudeaketa gastuak</span></div>`;
  }
  function niceStep(max) { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
  function shortMoney(v) { return v >= 1000 ? (v / 1000).toLocaleString("es-ES", { maximumFractionDigits: 1 }) + " k€" : v.toLocaleString("es-ES") + " €"; }

  function viewViajes() {

    const desdeBolo = (v) => !!(v.boloId && state.bolos.some((x) => x.id === v.boloId));

        <ul class="ledger">${list.map((v) => `

      </div>`
      : `<div class="card empty"><strong>Ez dago bidaiarik (${esc(periodoTxt())})</strong>Idatzi kide bakoitzaren gasolina, bidesariak, hotelak edo dietak, eta zein emanaldiri dagozkion.</div>`;
    return `<section style="display:grid;gap:12px">

      ${filt}
      ${loadingOr("viajes", body)}
    </section>`;
  }

  function materialCalc(m) {
    const ids = (Array.isArray(m.banatu) && m.banatu.length ? m.banatu : titulares().map((c) => c.id)).filter((id) => state.componentes.some((c) => c.id === id));
    const paid = m.ordainketak && typeof m.ordainketak === "object" && Object.keys(m.ordainketak).length ? m.ordainketak : (m.ordaindu ? { [m.ordaindu]: num(m.zenbatekoa) } : {});
    const total = round2(Object.values(paid).reduce((a, x) => a + num(x), 0));
    const share = ids.length ? total / ids.length : 0;
    const bal = {};
    ids.forEach((id) => (bal[id] = -share));
    Object.entries(paid).forEach(([id, x]) => { if (num(x) > 0) bal[id] = (bal[id] || 0) + num(x); });
    Object.keys(bal).forEach((k) => (bal[k] = round2(bal[k])));
    const pagadores = Object.entries(paid).filter(([, x]) => num(x) > 0).map(([id, x]) => ({ id, x: num(x) }));
    return { total, share: round2(share), n: ids.length, ids, bal, transfers: liquidar(bal), pagadores };
  }
  const pagadoresTxt = (l) => l.pagadores.length ? l.pagadores.map((p) => l.pagadores.length > 1 ? `${compName(p.id)} ${money(p.x)}` : compName(p.id)).join(", ") : "—";
  function viewMateriala() {
    if (state.loaded.componentes && !state.componentes.length) return `<section style="display:grid;gap:12px"><h2>Materiala</h2>${noComps()}</section>`;

      if (pg.pending.length) nPend++;

      l.ids.forEach((id) => (cuota[id] = round2((cuota[id] || 0) + l.share)));
      pg.pending.forEach((x) => { pend[x.from] = round2((pend[x.from] || 0) - x.rest); pend[x.to] = round2((pend[x.to] || 0) + x.rest); });
      return { m, l, pg };
    });
    const deudas = liquidar(pend);
    const cols = "88px minmax(0,1.6fr) minmax(0,1fr) 110px 110px";
    const tabla = items.length ? `
      <div class="card" style="--cols:${cols}">
        <div class="ledger-head"><div class="hide-m">Data</div><div>Erosketa</div><div class="hide-m">Nork ordaindu du</div><div class="r">Zenbatekoa</div><div class="r hide-m">Egoera</div></div>
        <ul class="ledger">${items.map(({ m, l, pg }) => `
          <li class="row" tabindex="0" data-edit="materiala" data-id="${esc(m.id)}">

            <div><div class="main">${esc(m.deskribapena || "Erosketa")}</div><div class="meta">${l.n} kideren artean · ${money(l.share)} bakoitzak<span class="only-m"> · ${fdate(m.fecha)} · ordaindu: ${esc(pagadoresTxt(l))} · ${pg.done || !l.transfers.length ? "kitatuta" : "kitatu gabe"}</span></div></div>
            <div class="hide-m">${esc(pagadoresTxt(l))}</div>
            <div class="r num"><strong>${money(l.total)}</strong></div>
            <div class="r hide-m">${pg.done || !l.transfers.length ? `<span class="pill ok">Kitatuta</span>` : `<span class="pill warn">Kitatu gabe</span>`}</div>
          </li>`).join("")}
        </ul>
        <div class="ledger-foot"><div class="hide-m"></div><div>Guztira</div><div class="hide-m"></div><div class="r num">${money(total)}</div><div class="hide-m"></div></div>
      </div>` : `<div class="card empty"><strong>Ez dago erosketarik (${esc(periodoTxt())})</strong>Idatzi taldearentzat erositakoa, nork ordaindu duen eta noren artean banatzen den.</div>`;
    const kideak = items.length ? `<div class="card" style="--cols:minmax(0,1.4fr) 1fr 1fr 1fr">
        <div class="ledger-head"><div>Kidea</div><div class="r hide-m">Ordaindu du</div><div class="r hide-m">Dagokiona</div><div class="r">Saldoa</div></div>
        <ul class="ledger">${state.componentes.map((c) => { const p = pagado[c.id] || 0, q = cuota[c.id] || 0, d = round2(p - q); return `
          <li class="row" style="cursor:default"><div><div class="main">${esc(c.nombre)}</div><div class="meta only-m">ordaindu ${money(p)} · dagokio ${money(q)}</div></div>
          <div class="r num hide-m">${money(p)}</div><div class="r num hide-m">${money(q)}</div>
          <div class="r num" style="color:${d < 0 ? "var(--bad)" : d > 0 ? "var(--good)" : "inherit"}"><strong>${d > 0 ? "+" : ""}${money(d)}</strong></div></li>`; }).join("")}</ul></div>

        ${loadingOr("materiala", tabla)}
      </section>
      ${items.length ? `<section style="display:grid;gap:10px"><h2>Kide bakoitza</h2>${kideak}</section>
      <section style="display:grid;gap:10px">
        <div><h2>Nork nori zor dio · materiala</h2><p class="hint">Oraindik egin gabe dauden ordainketak, gutxienera bilduta. "A → B": A-k B-ri ordaindu behar dio.</p></div>
        <div class="card card-pad" style="display:grid;gap:10px">${deudas.length ? `${transferHtml(deudas)}${state.canWrite ? `<div id="payall-box"><button type="button" class="btn small" data-pay-all>Dena ordainduta markatu</button></div>` : ""}` : `<p class="kitatuta">✓ Dena kitatuta. Inork ez dio inori ezer zor.</p>`}</div>
        <details class="card card-pad" ${nPend ? "open" : ""}><summary>Erosketaz erosketa · ${nPend ? nPend + " kitatu gabe" : "denak kitatuta"}</summary>${items.map(({ m, l, pg }) => `
          <div class="bolo-liq"><div class="main">${esc(m.deskribapena || "Erosketa")} · ${fdate(m.fecha)} ${pg.done || !l.transfers.length ? `<span class="pill ok">Kitatuta</span>` : `<span class="pill warn">Kitatu gabe</span>`}</div>
          <div class="meta">Ordaindu: ${esc(pagadoresTxt(l))} · ${money(l.total)} ÷ ${l.n} = ${money(l.share)} bakoitzak</div>
          ${pg.list.length ? `<ul class="deudas">${pg.list.map((x) => `<li class="${x.paid ? "pagado" : ""}"><strong>${esc(compName(x.from))}</strong> <span class="arrow">→</span> <strong>${esc(compName(x.to))}</strong><span class="num">${money(x.amount)}</span>

          </div>`).join("")}</details>
      </section>` : ""}`;
  }

  function pinInfo(c) {
    const pins = window.sustraiPinIds;
    const tienePin = pins ? pins.has(c.id) : null;
    const lot = c.uid ? `<span class="pago-ok">✓ lotuta</span>` : `<span class="pago-pend">lotu gabe</span>`;

  }
  // ---------- Setlist ----------
  const durSec = (t) => { const s = String(t || "").trim().replace(",", ".").replace(".", ":"); if (!s) return 0; const p = s.split(":").map((x) => parseInt(x, 10) || 0); return p.length === 1 ? p[0] * 60 : p.length === 2 ? p[0] * 60 + p[1] : p[0] * 3600 + p[1] * 60 + p[2]; };
  const fmtDur = (sec) => { sec = Math.round(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
  const repSorted = () => [...state.abestiak].sort((a, b) => (a.izena || "").localeCompare(b.izena || "", "es"));
  const abestia = (id) => state.abestiak.find((x) => x.id === id);
  const setlistInfo = (sl) => { const items = Array.isArray(sl.items) ? sl.items : []; const songs = items.filter((x) => x.a); const sec = songs.reduce((s2, x) => s2 + durSec((abestia(x.a) || {}).iraupena), 0); const sinDur = songs.filter((x) => !durSec((abestia(x.a) || {}).iraupena)).length; return { items, n: songs.length, sec, sinDur }; };
  // Taldeak (multzoak): {g: "izena"} elementuak; ondorengo abestiak talde horretakoak dira hurrengo taldera arte.
  const slGroups = (items) => { const out = []; let cur = null; (items || []).forEach((x, i) => { if (x.g !== undefined) { cur = { i, name: x.g, n: 0, sec: 0, sinDur: 0 }; out.push(cur); } else if (x.a && cur) { const d = durSec((abestia(x.a) || {}).iraupena); cur.n++; cur.sec += d; if (!d) cur.sinDur++; } }); return out; };
  const grpTxt = (g) => `${g.n} abesti${g.sec ? " · " + fmtDur(g.sec) : ""}`;
  const itemName = (it) => it.a ? ((abestia(it.a) || {}).izena || "(ezabatutako abestia)") : it.g !== undefined ? (it.g || "Taldea") : (it.t || "");
  const durTxt = (inf) => `${inf.n} abesti${inf.sec ? " · " + fmtDur(inf.sec) : ""}${inf.sinDur && inf.sec ? ` (+${inf.sinDur} iraupenik gabe)` : ""}`;

  function viewSetlist() {
    const sls = [...state.setlistak].sort((a, b) => { const fa = (state.bolos.find((x) => x.id === a.boloId) || {}).fecha || a.fecha || "", fb = (state.bolos.find((x) => x.id === b.boloId) || {}).fecha || b.fecha || ""; return fb.localeCompare(fa) || (a.izena || "").localeCompare(b.izena || "", "es"); });
    const slHtml = sls.length ? `<div class="card" style="--cols:minmax(0,1.6fr) minmax(0,1fr) 120px">
        <div class="ledger-head"><div>Setlista</div><div class="hide-m">Emanaldia</div><div class="r">Agertokia</div></div>
        <ul class="ledger">${sls.map((sl) => { const inf = setlistInfo(sl); return `
          <li class="row" tabindex="0" data-edit-setlist="${esc(sl.id)}">
            <div><div class="main">${esc(sl.izena || "Setlista")}</div>${(() => { const gs = slGroups(sl.items); return gs.length ? `<div class="sl-groups">${gs.map((g) => `<span>${esc(g.name || "Taldea")}: ${esc(grpTxt(g))}</span>`).join("")}</div>` : ""; })()}<div class="meta">${esc(durTxt(inf))}<span class="only-m">${sl.boloId ? " · " + esc(boloName(sl.boloId)) : ""}</span></div></div>
            <div class="meta hide-m">${sl.boloId ? esc(boloName(sl.boloId)) : "—"}</div>
            <div class="r"><button type="button" class="btn small" data-stage="${esc(sl.id)}">▶ Ikusi</button></div>
          </li>`; }).join("")}</ul></div>`
      : `<div class="card empty"><strong>Oraindik ez dago setlistik</strong>Sortu bat emanaldi baterako, errepertorioko abestiak ordenatuz.</div>`;
    const reps = repSorted();
    const repHtml = reps.length ? `<div class="card" style="--cols:minmax(0,1.5fr) 80px 100px 80px">
        <div class="ledger-head"><div>Abestia</div><div class="hide-m">Tonua</div><div class="hide-m">Triki</div><div class="r">Iraupena</div></div>
        <ul class="ledger">${(() => {
          // Trikiaren tonuaren arabera taldekatuta (tonurik gabekoak azkenean).
          const grupos = new Map();
          reps.forEach((a) => { const t = String(a.triki || "").trim(); const k = t.toLowerCase(); if (!grupos.has(k)) grupos.set(k, { label: t, list: [] }); grupos.get(k).list.push(a); });
          const keys = [...grupos.keys()].sort((x, y) => (x === "") - (y === "") || x.localeCompare(y, "es", { numeric: true }));
          const conTono = keys.some((k) => k !== "");
          return keys.map((k) => { const g = grupos.get(k); const sec = g.list.reduce((s2, a) => s2 + durSec(a.iraupena), 0);

  function renderSlList() {
    const it = current.items, ro = !state.canWrite;
    let pos = 0;
    const gs = slGroups(it);
    const btns = (i) => ro ? "" : `<span class="sl-btns"><button type="button" class="sl-b" data-sl-up="${i}" aria-label="Gora" ${i === 0 ? "disabled" : ""}>↑</button><button type="button" class="sl-b" data-sl-down="${i}" aria-label="Behera" ${i === it.length - 1 ? "disabled" : ""}>↓</button><button type="button" class="sl-b sl-x" data-sl-del="${i}" aria-label="Kendu">×</button></span>`;
    const have = new Set(it.map((x) => x.a).filter(Boolean));
    const songOpts = () => `<option value="">+ Abestia talde honetara…</option>` + repSorted().map((a) => `<option value="${esc(a.id)}">${have.has(a.id) ? "✓ " : ""}${esc(a.izena)}${a.iraupena ? " (" + esc(fmtDur(durSec(a.iraupena))) + ")" : ""}</option>`).join("");
    // Talde bakoitzaren amaieran (hurrengo taldearen aurretik) abestia zuzenean gehitzeko lerroa.
    const addRow = (at) => ro || !gs.length ? "" : `<li class="sl-addrow"><select data-sl-gsel="${at}" aria-label="Gehitu abestia talde honetara">${songOpts()}</select></li>`;

    if (sel) { const have = new Set(it.map((x) => x.a).filter(Boolean)); sel.innerHTML = `<option value="">${state.abestiak.length ? "Aukeratu abestia…" : "Errepertorioa hutsik dago"}</option>` + repSorted().map((a) => `<option value="${esc(a.id)}">${have.has(a.id) ? "✓ " : ""}${esc(a.izena)}${a.iraupena ? " (" + esc(fmtDur(durSec(a.iraupena))) + ")" : ""}</option>`).join(""); }
  }
  async function saveSetlist() {
    const izena = ($("sl-izena").value || "").trim();
    if (!izena) { $("form-err").textContent = "Jarri izen bat setlistari."; return; }
    const prev = current.id ? state.setlistak.find((x) => x.id === current.id) : null;
    const now = new Date().toISOString();
    const data = { izena, boloId: $("sl-bolo").value || "", items: current.items.map((x) => (x.a ? { a: x.a } : x.g !== undefined ? { g: x.g } : { t: x.t })), notas: ($("sl-notas").value || "").trim(), actualizado: now, creado: prev && prev.creado ? prev.creado : now };
    const btn = $("btn-save"); btn.disabled = true; btn.textContent = "Gordetzen…";
    try {
      const col = state.db.collection("setlistak");
      await (current.id ? col.doc(current.id) : col.doc()).set(data);
      closeForm(); toast("Setlista gordeta");
    } catch (er) { btn.disabled = false; btn.textContent = "Gorde"; handleWriteError(er, true); }
  }

  function nextFactura() {

    let max = 0;

    return y + "-" + String(max + 1).padStart(3, "0");
  }

  let current = null;
  function openForm(kind, id, prefill) {

    const ro = !state.canWrite;
