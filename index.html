      }
      else if (f.type === "multi") {
        const sel = Array.isArray(v) && v.length ? v : (f.defSel || f.options.map((o) => o[0]));
        const chk = ([val, lab, , ins]) => `<label><input type="checkbox" value="${esc(val)}" ${sel.includes(val) ? "checked" : ""} ${ro ? "disabled" : ""}> <span>${esc(lab)}${ins ? ` <span class="meta" style="font-size:12px">· ${esc(ins)}</span>` : ""}</span></label>`;
        const tit = f.options.filter((o) => !o[2]), ord = f.options.filter((o) => o[2]);
        input = ord.length
          ? `<div id="${fid}" style="display:grid;gap:6px"><div class="multi">${tit.map(chk).join("") || '<span class="meta">Kiderik ez</span>'}</div><div class="multi"><span class="meta" style="font-weight:600;grid-column:1/-1;text-transform:uppercase;font-size:12px;letter-spacing:.04em">Ordezkoak</span>${ord.map(chk).join("")}</div></div>`
          : `<div class="multi" id="${fid}">${tit.map(chk).join("")}</div>`;
      } else input = `<input id="${fid}" type="${f.type}" ${f.step ? `step="${f.step}"` : ""} ${f.min ? `min="${f.min}"` : ""} ${f.list ? `list="${f.list}"` : ""} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""} value="${esc(v ?? "")}" ${f.type === "number" ? 'inputmode="decimal"' : ""} ${ro ? "readonly" : ""}>`;
      const extra = f.suggest && !ro ? ` <button type="button" class="linkbtn" id="btn-sug">Hurrengo zk.</button>` : "";
      return `<div class="field ${f.full ? "full" : ""}" id="wrap-${f.id}"><label for="${fid}" id="${fid}-l">${esc(f.label)}${req}${extra}</label>${input}${f.hint ? `<span class="hint" style="margin:0">${esc(f.hint)}</span>` : ""}</div>`;
    }).join("");
    $("dialog").innerHTML = `
      <h3>${def.title[id ? 1 : 0]}</h3>
      <div class="form-grid">${html}</div>
      ${kind === "bolo" ? `<div class="calc" id="calc"></div>` : ""}
      ${kind === "viaje" ? `<p class="hint" id="km-hint" style="margin:0"></p>` : ""}
      <div class="err" id="form-err" role="alert"></div>
      <div class="actions">
        ${id && !ro && !(kind === "componente" && state.componentes.some((c) => c.id === id && c.admin)) ? `<button type="button" class="btn danger" id="btn-del">Ezabatu</button>` : ""}
        <span class="spacer"></span>
        <button type="button" class="btn" id="btn-cancel">${ro ? "Itxi" : "Utzi"}</button>
        ${ro ? "" : `<button type="submit" class="btn primary" id="btn-save">Gorde</button>`}
      </div>
      <datalist id="dl-clientes">${clientes.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
      <datalist id="dl-triki">${[...new Set(state.abestiak.map((a) => a.triki).filter(Boolean))].sort().map((x) => `<option value="${esc(x)}">`).join("")}</datalist>
      <datalist id="dl-rutas">${state.rutas.map((r) => `<option value="${esc(r.trayecto)}">`).join("")}</datalist>`;
    $("overlay").hidden = false;
    const first = $("dialog").querySelector("input:not([type=checkbox]):not([type=radio]), select");
    if (first) first.focus();
    if (kind === "bolo") { syncFacturaNum(); syncPagoExtra(); updateCalc(); updateCoches(); }
    if (kind === "viaje") updateKm(false);
    if (kind === "materiala" || kind === "bolo") updatePagTotal();
  }

  function updatePagTotal() { const el = $("pag-total"); if (!el) return; let t = 0; $("dialog").querySelectorAll(".pag-in").forEach((i) => (t += num(i.value))); el.textContent = money(round2(t)); }
  function readForm() {
    const def = FORMS[current.kind], data = {};
    let missing = null;
    def.fields().forEach((f) => {
      if (f.sep) return;
      const fid = "fld-" + f.id;
      let v;
      if (f.type === "yesno") { const r = $("dialog").querySelector(`input[name="${fid}"]:checked`); v = r ? r.value === "1" : false; }
      else if (f.type === "cena3") { const r = $("dialog").querySelector(`input[name="${fid}"]:checked`); v = !r || r.value === "1" ? true : r.value === "0" ? false : "zehazteko"; }
      else if (f.type === "multi") v = [...$(fid).querySelectorAll("input:checked")].map((i) => i.value);
      else if (f.type === "pagadores") { v = {}; $(fid).querySelectorAll(".pag-in").forEach((i) => { const n = round2(num(i.value)); if (n > 0) v[i.dataset.c] = n; }); }
      else if (f.type === "coches") v = [...$(fid).querySelectorAll(".coche-row")].filter((r) => r.querySelector(".coche-on").checked).map((r) => ({ c: r.dataset.c, autobidea: r.querySelector(".coche-ap").checked, manual: !!r.dataset.manual, trayecto: r.querySelector(".coche-tray").value.trim(), nota: r.querySelector(".coche-note").textContent, km: r.querySelector(".coche-km").value === "" ? null : round2(num(r.querySelector(".coche-km").value)), peajes: r.querySelector(".coche-peajes").value === "" ? null : round2(num(r.querySelector(".coche-peajes").value)) }));
      else { const el = $(fid); if (!el) return; v = f.type === "number" ? (el.value === "" ? null : round2(num(el.value))) : el.value.trim(); }
      if (f.required && (v === "" || v === null)) missing = missing || f.label;
      data[f.id] = v;
    });
    if (current.kind === "bolo" && has(data.pagoIntegrante)) { const pe = $("fld-pagoIntegrante"); if (pe) data.pagoIntegrante = round2(data.pagoIntegrante - num(pe.dataset.extra)); }
    return { data, missing };
  }

  function updateCalc() {
    const { data } = readForm();
    data.id = current.id || "__nuevo__";
    const c = boloCalc(data);
    const n = (data.tocan || []).length;
    $("calc").innerHTML = `
      <div><span>${c.facturado ? "Aurrekontua (BEZik gabe)" : "Aurrekontua (fakturarik gabe)"}</span><span class="num">${money(c.ingreso)}</span></div>
      <div><span>− Kideei ordainketa (${n} × ${money(c.pagoBase)})</span><span class="num">${money(round2(c.pagoBase * n))}</span></div>
      ${c.extraCena ? `<div><span>− Afaririk gabeko gehigarria kideei (${money(c.extraCena)} ÷ ${n} = ${money(c.extraPor)} bakoitzak)</span><span class="num">${money(round2(c.extraPor * n))}</span></div>` : ""}
      ${(() => {
        const otros = state.viajes.filter((v) => v.boloId === (current.id || "__nuevo__") && !v.auto);
        const rate = has(data.eurKm) ? num(data.eurKm) : (num(state.ajustes.eurKm) || EURKM_DEF);
        const coches = (data.coches || []).map((it) => ({ componente: it.c, importe: cocheImporte(it, rate) }));
        const l = boloViajes(data, [...otros, ...coches]);
        if (!l.total) return "";
        return `<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><div><span><strong>Bidaiak${afariGastuak(data).length ? " eta afaria" : ""}</strong> (${money(l.total)} ÷ ${l.n} = ${money(l.share)} bakoitzak)</span><span></span></div>${l.transfers.map((x) => `<div><span>${esc(compName(x.from))} → ${esc(compName(x.to))}</span><span class="num">${money(x.amount)}</span></div>`).join("") || `<div><span>Inork ez dio inori ezer zor</span><span></span></div>`}</div>`;
      })()}
      <div class="tot"><span>Kudeaketa gastuak</span><span class="num" style="color:${c.gestion < 0 ? "var(--bad)" : "inherit"}">${money(c.gestion)}</span></div>
      ${c.facturado ? `<div style="margin-top:6px;color:var(--muted)"><span>Bezeroari kobratzekoa (%${IVA_DEF} BEZarekin)</span><span class="num">${money(c.aCobrar)}</span></div>` : ""}`;
  }
  function updateKm(fromKm) {
    const km = num($("fld-km").value), rate = $("fld-eurKm").value === "" ? (num(state.ajustes.eurKm) || EURKM_DEF) : num($("fld-eurKm").value), peajes = num($("fld-peajes").value);

    const hint = $("km-hint");

      const calc = round2(km * rate + peajes);
      hint.textContent = `${km} km × ${money(rate)}/km${peajes ? " + " + money(peajes) + " bidesari" : ""} = ${money(calc)}`;
      if (fromKm) $("fld-importe").value = calc.toFixed(2);
    } else hint.textContent = "";
  }

  $("dialog").addEventListener("input", (e) => {
    if (!current) return;
    if (current.kind === "bolo" && (e.target.classList.contains("coche-km") || e.target.classList.contains("coche-peajes"))) { const row = e.target.closest(".coche-row"); delete row.dataset.km1; row.dataset.manual = "1"; const n = row.querySelector(".coche-note"); delete n.dataset.base; n.textContent = "Eskuz aldatua. Gordetzean, ibilbide hau gogoratuko da hurrengorako."; }
    if (current.kind === "materiala" || current.kind === "bolo") updatePagTotal();

    if (current.kind === "viaje" && ["fld-km", "fld-tipo", "fld-eurKm", "fld-peajes"].includes(e.target.id)) updateKm(true);
  });
  function boloTarifa() {
    const mod = $("fld-modalidad").value;
    const r = $("dialog").querySelector('input[name="fld-cena"]:checked');
    const cena = r ? r.value !== "0" : true;
    $("fld-presupuesto").value = precioAuto(mod, cena);
    $("fld-pagoIntegrante").value = pagoAuto(mod);
    $("fld-pagoIntegrante").dataset.extra = "0";
    syncPagoExtra();
    syncFacturaNum();
  }
  function syncPagoExtra() {
    const el = $("fld-pagoIntegrante"); if (!el) return;
    const r = $("dialog").querySelector('input[name="fld-cena"]:checked');
    const tc = $("fld-tocan"), n = tc ? tc.querySelectorAll("input:checked").length : 0;
    const ex = r && r.value === "0" && n ? round2(tarifa().extra / n) : 0;
    const old = num(el.dataset.extra);
    if (ex !== old) { if (el.value !== "") el.value = round2(num(el.value) - old + ex); el.dataset.extra = ex; }
  }
  function syncAfari() { const w = $("wrap-afariOrdainketak"); if (!w) return; const r = $("dialog").querySelector('input[name="fld-cena"]:checked'); w.style.display = r && r.value === "0" ? "" : "none"; }
  function syncFacturaNum() { syncAfari(); const sf = esSinFactura($("fld-modalidad").value); ["wrap-facturaNum", "wrap-facturaEmitida"].forEach((k) => { const w = $(k); if (w) w.style.display = sf ? "none" : ""; }); }

    if (current.kind === "bolo" && e.target.classList.contains("coche-ap")) { const row = e.target.closest(".coche-row"); if (!e.target.checked) { row.querySelector(".coche-peajes").value = "0.00"; } if (row.querySelector(".coche-tray").value.trim()) { row.dataset.tray = ""; calcRuta(row, row.querySelector(".coche-calc")); } }
    if (current.kind === "bolo" && e.target.classList.contains("coche-tray")) { const row = e.target.closest(".coche-row"); if (e.target.value.trim() && e.target.value.trim() !== row.dataset.tray) calcRuta(row, row.querySelector(".coche-calc")); }
    if (current.kind === "bolo" && e.target.name === "fld-idaVuelta") { const ida = e.target.value === "1"; $("dialog").querySelectorAll(".coche-row").forEach((row) => applyIda(row, ida)); }
    if (current.kind === "bolo") { syncPagoExtra(); updateCalc(); updateCoches(); }
    if (current.kind === "viaje" && e.target.id === "fld-tipo") updateKm(true);
  });

  function closeForm() { $("overlay").hidden = true; current = null; $("dialog").innerHTML = ""; $("dialog").classList.remove("stage-dialog"); document.body.classList.remove("printing-stage"); render(); }
  $("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeForm(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("overlay").hidden) closeForm(); });

  $("dialog").addEventListener("click", (e) => {
    const id = e.target.id;
    if (id === "btn-cancel") return closeForm();
    if (id === "btn-del") return confirmDelete();
    if (id === "btn-del-yes") return doDelete();
    if (id === "btn-del-no") return current.kind === "setlist" ? openSetlist(current.id) : openForm(current.kind, current.id);
    if (id === "btn-sug") { e.preventDefault(); $("fld-facturaNum").value = nextFactura(); return; }
    if (id === "btn-save-aj") return saveAjustes();
    if (current && current.kind === "setlist") {
      const up = e.target.closest("[data-sl-up]"), dn = e.target.closest("[data-sl-down]"), rm = e.target.closest("[data-sl-del]");
      const it = current.items;
      if (up) { const i = +up.dataset.slUp; if (i > 0) [it[i - 1], it[i]] = [it[i], it[i - 1]]; return renderSlList(); }
      if (dn) { const i = +dn.dataset.slDown; if (i < it.length - 1) [it[i + 1], it[i]] = [it[i], it[i + 1]]; return renderSlList(); }
      if (rm) { it.splice(+rm.dataset.slDel, 1); return renderSlList(); }
      if (id === "sl-add-btn") { const v = $("sl-add-sel").value; if (!v) return; it.push({ a: v }); $("sl-add-sel").value = ""; return renderSlList(); }
      if (id === "sl-add-all") { const have = new Set(it.map((x) => x.a).filter(Boolean)); repSorted().forEach((a) => { if (!have.has(a.id)) it.push({ a: a.id }); }); return renderSlList(); }
      if (id === "sl-group-btn") { const v = $("sl-group").value.trim(); if (!v) return; it.push({ g: v }); $("sl-group").value = ""; return renderSlList(); }

      return;
    }
    const ul = t.closest("[data-unlink]"); if (ul) { e.stopPropagation(); { const cu = state.componentes.find((x) => x.id === ul.dataset.unlink); if (cu && window.sustraiUnlink) window.sustraiUnlink(cu.id).catch(() => {}); } state.db.collection("componentes").doc(ul.dataset.unlink).update({ uid: null, actualizado: new Date().toISOString() }).then(() => toast("Lotura kenduta")).catch(handleWriteError); return; }
    if (t.closest("[data-claim]")) {
      const id = $("claim-sel") && $("claim-sel").value; if (!id) return toast("Aukeratu zure izena.");
      const c = state.componentes.find((x) => x.id === id); if (!c || c.admin) return toast("Izen hori ezin da aukeratu.");
      const pin = ($("claim-pin") && $("claim-pin").value || "").trim(); if (!pin) return toast("Idatzi zure PINa.");
      window.sustraiClaim(id, pin).then(() => { toast("Lotuta ✓ Kaixo, " + c.nombre + "!"); setTimeout(() => location.reload(), 700); }).catch(() => toast("PIN okerra edo izen hori hartuta dago."));
      return;
    }
    const gc = t.closest("[data-goto-comp]"); if (gc) { state.filtroComp = gc.dataset.gotoComp; return goTab("viajes"); }
    const row = t.closest("[data-edit]"); if (row) return openForm(row.dataset.edit, row.dataset.id);
  });
  $("view").addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && (e.target.classList.contains("row") || e.target.classList.contains("tile-btn"))) { e.preventDefault(); e.target.click(); } });
  $("view").addEventListener("change", (e) => { if (e.target.id === "f-comp") { state.filtroComp = e.target.value; render(); } });

  async function togglePago(boloId, key, amount, col) {
    col = col || "bolos";
    if (!state.db || !state.canWrite || busy.has(boloId)) return;
    const b = state[col].find((x) => x.id === boloId); if (!b) return;
    const cur = num((b.ordainduak || {})[key]);
    const paid = cur >= amount - 0.009;
    busy.add(boloId);
    try { await state.db.collection(col).doc(boloId).update({ ordainduak: { [key]: paid ? 0 : amount } }); if (col === "bolos" && !state.limited) marcarVisto([boloId + "|" + key], !paid); toast(paid ? "Ordaindu gabe gisa markatuta" : "Ordainduta ✓"); }
    catch (er) { handleWriteError(er); }
    finally { busy.delete(boloId); }
  }
  async function pagarTodo(mes) {
    if (!state.db || !state.canWrite) return;
    const bolos = state.bolos.filter((b) => inYear(b.fecha) && (!mes || (b.fecha || "").slice(0, 7) === mes));
    try {
      for (const b of bolos) {
        const l = boloViajes(b); if (!l.total) continue;
        const pg = boloPagos(b, l); if (!pg.pending.length) continue;
        const upd = {}; pg.pending.forEach((x) => (upd[payKey(x)] = x.amount));
        await state.db.collection("bolos").doc(b.id).update({ ordainduak: upd });
        if (!state.limited) marcarVisto(Object.keys(upd).map((k) => b.id + "|" + k), true);
      }
      toast(mes ? mesLargo(mes) + " kitatuta ✓" : "Dena kitatuta ✓");
    } catch (er) { handleWriteError(er); render(); }
  }
  async function pagarMaterial() {
    if (!state.db || !state.canWrite) return;
    try {
      for (const m of state.materiala.filter((x) => inYear(x.fecha))) {
        const pg = boloPagos(m, materialCalc(m)); if (!pg.pending.length) continue;
        const upd = {}; pg.pending.forEach((x) => (upd[payKey(x)] = x.amount));
        await state.db.collection("materiala").doc(m.id).update({ ordainduak: upd });
      }
      toast("Materiala kitatuta ✓");
    } catch (er) { handleWriteError(er); render(); }
  }
  const busy = new Set();
  async function toggle(col, id, field) {
    if (!state.db || !state.canWrite || busy.has(id)) return;
    const item = state[col].find((x) => x.id === id); if (!item) return;
    busy.add(id);
    try { await state.db.collection(col).doc(id).update({ [field]: !item[field], actualizado: new Date().toISOString() }); }
    catch (er) { handleWriteError(er); }
    finally { busy.delete(id); }
  }

  // ---------- Datos ----------
  const setStatus = (text) => { $("sync-status").textContent = text; };
  const showBanner = (text) => { const b = $("banner"); b.textContent = text; b.hidden = !text; };

  window.addEventListener("sustrai-pins", () => { if ($("overlay").hidden) render(); });
  async function start() {
    render();
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude && window.claude.use ? window.claude.use("db") : null, window.claude && window.claude.use ? window.claude.use("user") : null]); } catch (e) {}
    if (!db) {
      setStatus("Daturik gabe: konexiorik ez");
      showBanner("Ezin izan da datu-basera konektatu. Egiaztatu internet konexioa eta config.js fitxategia.");
      Object.keys(state.loaded).forEach((k) => (state.loaded[k] = true));
      state.canWrite = false;
      render();
      return;
    }
    state.db = db;
    if (user && typeof user.can === "function") {
      try { const c = await user.can("data.write"); if (c === false) { state.canWrite = false; showBanner("Kontuak ikus ditzakezu, baina ezin dituzu aldatu."); } } catch (e) {}
    }
    try { state.limited = !(user && (await user.isOwner())); } catch (e) { state.limited = true; }
    if (state.limited && user) { try { const me = await user.me(); state.myEmail = me.email ? String(me.email).trim().toLowerCase() : null; state.myId = me.id || null; } catch (e) {} }
    if (!state.limited) state.tab = "bolos";
    render();
    const timer = setTimeout(() => setStatus("Oraindik ezin dira datuak kargatu"), 10000);
    const SL_COLS = ["abestiak", "setlistak"];
    if (state.limited) SL_COLS.forEach((k) => (state.loaded[k] = true));
    const cols = Object.keys(state.loaded).filter((k) => !state.limited || !SL_COLS.includes(k)), ok = new Set();
    cols.forEach((c) => {
      db.collection(c).onSnapshot((snap) => {
        state[c] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        state.loaded[c] = true;
        if (!snap.metadata.fromCache) { ok.add(c); if (ok.size === cols.length) { clearTimeout(timer); setStatus("Hodeian gordeta · taldearekin partekatuta"); } }
        if ($("overlay").hidden) render(); else renderTabs();
      }, (err) => {
        clearTimeout(timer);
        state.loaded[c] = true;
        setStatus("Errorea datuak kargatzean");
        if (err && err.code === "revoked") { state.canWrite = false; showBanner("Jada ez duzu kontu hauetarako sarbiderik."); }
        render();
      });
    });
    db.doc("ajustes/general").onSnapshot((snap) => { if (snap.exists) { state.ajustes = Object.assign({ eurKm: EURKM_DEF }, snap.data()); if ($("overlay").hidden) render(); } }, () => {});
  }
  start();
})();
</script>
</body>
</html>
